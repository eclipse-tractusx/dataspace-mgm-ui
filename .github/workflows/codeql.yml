# Static code analysis with CodeQL (TRG 8.01)
name: "CodeQL"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 0 * * 0" # once a week
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ["actions", "javascript-typescript"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # CodeQL fails on a language without source files; skip JavaScript/TypeScript until the sources are in the repository
      - name: Check for source files
        id: sources
        run: |
          if [ "${{ matrix.language }}" != "javascript-typescript" ] || [ -n "$(git ls-files '*.ts' '*.tsx' '*.js' '*.jsx')" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "No JavaScript or TypeScript files found, skipping the analysis."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Initialize CodeQL
        if: steps.sources.outputs.present == 'true'
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          queries: +security-extended,security-and-quality

      - name: Perform CodeQL analysis
        if: steps.sources.outputs.present == 'true'
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
