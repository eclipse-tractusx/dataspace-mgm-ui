# Vulnerability and misconfiguration scanning with Trivy (TRG 8.04):
# - the repository (Dockerfile, lock files) on every change
# - the released image on DockerHub once a day
name: "Trivy"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 1 * * *" # once a day
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: tractusx/dataspace-mgm-ui

jobs:
  analyze-repository:
    name: Analyze repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Trivy in filesystem mode
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          scanners: "vuln,misconfig"
          format: "sarif"
          output: "trivy-results-repository.sarif"
          severity: "CRITICAL,HIGH"
          # apply the severity filter to the SARIF report and the exit code as well
          limit-severities-for-sarif: true
          exit-code: "1"
          hide-progress: true

      - name: Upload SARIF file
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: "trivy-results-repository.sarif"
          category: "trivy-repository"

  analyze-image:
    name: Analyze released image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check that the image is published
        id: image
        run: |
          if docker manifest inspect "${IMAGE}:latest" > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "Image ${IMAGE}:latest is not published yet, skipping the scan."
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Trivy vulnerability scanner
        if: steps.image.outputs.published == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "${{ env.IMAGE }}:latest"
          format: "sarif"
          output: "trivy-results-image.sarif"
          severity: "CRITICAL,HIGH"
          # apply the severity filter to the SARIF report and the exit code as well
          limit-severities-for-sarif: true
          vuln-type: "os,library"
          exit-code: "1"
          hide-progress: true

      - name: Upload SARIF file
        if: always() && steps.image.outputs.published == 'true'
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: "trivy-results-image.sarif"
          category: "trivy-image"
