# Third-party license check with the Eclipse Dash License Tool (TRG 7.01, TRG 7.04).
# Generates the DEPENDENCIES file from package-lock.json and fails if a dependency is
# `restricted` or `rejected`, or if the committed DEPENDENCIES file is out of date.
# With the secret ECLIPSE_DASH_TOKEN, a manual run can request IP reviews for unknown packages.
name: "Eclipse Dash IP Check"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    paths:
      - "package.json"
      - "package-lock.json"
      - "DEPENDENCIES"
      - ".github/workflows/dependencies.yml"
  workflow_dispatch:
    inputs:
      request_review:
        description: "Request IP reviews for unknown packages (needs the secret ECLIPSE_DASH_TOKEN)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  DASH_VERSION: "1.1.0"

jobs:
  check-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for the lock file
        id: sources
        run: |
          if [ -f package-lock.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "package-lock.json not found, nothing to check."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java
        if: steps.sources.outputs.present == 'true'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Run the Eclipse Dash License Tool
        if: steps.sources.outputs.present == 'true'
        env:
          ECLIPSE_DASH_TOKEN: ${{ secrets.ECLIPSE_DASH_TOKEN }}
        run: |
          curl -sSL --output dash.jar "https://repo.eclipse.org/service/rest/v1/search/assets/download?repository=dash-maven2-releases&maven.groupId=org.eclipse.dash&maven.artifactId=org.eclipse.dash.licenses&maven.baseVersion=${DASH_VERSION}&maven.extension=jar"
          ARGS=(-project automotive.tractusx -summary DEPENDENCIES.generated)
          if [ "${{ inputs.request_review }}" = "true" ] && [ -n "${ECLIPSE_DASH_TOKEN}" ]; then
            ARGS+=(-review -token "${ECLIPSE_DASH_TOKEN}")
          fi
          java -jar dash.jar "${ARGS[@]}" package-lock.json || true
          sort -o DEPENDENCIES.generated DEPENDENCIES.generated

      - name: Upload the generated DEPENDENCIES file
        if: steps.sources.outputs.present == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DEPENDENCIES
          path: DEPENDENCIES.generated

      - name: Check for restricted or rejected dependencies
        if: steps.sources.outputs.present == 'true'
        run: |
          if grep -E ', (restricted|rejected),' DEPENDENCIES.generated; then
            echo "::error::Some dependencies are restricted or rejected, see above. Request an IP review (TRG 7.04)."
            exit 1
          fi

      - name: Check that DEPENDENCIES is up to date
        if: steps.sources.outputs.present == 'true'
        run: |
          if ! diff -u <(sort DEPENDENCIES 2>/dev/null) DEPENDENCIES.generated; then
            echo "::error::DEPENDENCIES is out of date. Replace it with the artifact 'DEPENDENCIES' of this run."
            exit 1
          fi
