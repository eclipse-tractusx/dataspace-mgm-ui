# Infrastructure as code scanning with KICS (TRG 8.02): Dockerfile, Helm chart, GitHub workflows
name: "KICS"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 0 * * 0" # once a week
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run KICS scan with SARIF result
        uses: checkmarx/kics-github-action@05aa5eb70eede1355220f4ca5238d96b397e30a6 # v2.1.20
        with:
          path: "."
          output_path: kicsResults/
          output_formats: "json,sarif"
          # fail on high (and above) findings and on KICS engine errors
          fail_on: high
          # secrets are covered by TruffleHog
          disable_secrets: true

      - name: Upload SARIF file
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: kicsResults/results.sarif
