<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wallets as a service · Your credentials — Mockup</title>
  <link rel="stylesheet" href="../shared/tokens.css">
  <link rel="stylesheet" href="../shared/shell.css">
  <link rel="stylesheet" href="../shared/wallets.css">
  <style>
    .cr-info { border: 0; background: transparent; color: var(--muted); cursor: help; padding: 2px; border-radius: 6px; display: inline-grid; place-items: center; }
    .cr-info:hover { color: var(--text); background: var(--accent-hover); }
    .cr-name { display: inline-flex; align-items: center; gap: 6px; }
    .cr-passes { grid-template-columns: repeat(auto-fit, minmax(320px, 460px)); }
    .wx-pass .cr-info { color: var(--pass-muted); }
    .cr-times { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 12px; margin: 0; font-size: 0.875rem; }
    .cr-times dt { color: var(--muted); }
    .cr-times dd { margin: 0; }
    .cr-lane + .cr-lane { margin-top: 24px; }
    .cr-lane__head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
    .cr-lane .wx-hstep { opacity: 0.55; }
    .cr-lane .wx-hstep.is-done, .cr-lane .wx-hstep.is-current, .cr-lane .wx-hstep.is-failed { opacity: 1; }
    .cr-lane .wx-hstep.is-current { border-color: var(--warning); }
    .cr-lane .wx-hstep.is-failed { border-color: var(--error); }
  </style>
</head>
<!-- C4-M1 7.1 GET /companies/{companyId}/credentials (listCompanyCredentials, view_credentials, scope company) →
     CredentialStatusView[]: credentialType, status (NONE … REVOKED), requestedAt, issuedAt, revokedAt. -->
<body data-active="/wallets" data-view="Your credentials" data-states="issued,two-dataspaces,being-issued,failed,revoked,not-requested,loading,forbidden">
  <main class="tx-page" aria-labelledby="view-title">
    <div class="mock-persona" id="persona"></div>

    <div class="wx-markers" aria-hidden="true">
      <span data-variant="layout:passes" data-dimension="Layout" data-variant-label="Passes, like a phone wallet"></span>
      <span data-variant="layout:table" data-variant-label="Table"></span>
      <span data-variant="layout:lifecycle" data-variant-label="Life cycle per credential"></span>
      <span data-variant="explain:text" data-dimension="What a credential is for" data-variant-label="Sentence under the name"></span>
      <span data-variant="explain:info" data-variant-label="Info button with a tooltip"></span>
      <span data-variant="summary:banner" data-dimension="Overall status" data-variant-label="Banner above the credentials"></span>
      <span data-variant="summary:none" data-variant-label="None (each credential speaks for itself)"></span>
    </div>

    <div class="tx-overline">Wallets as a service</div>
    <h1 class="tx-title" id="view-title">Your credentials</h1>
    <div id="feature-tabs"></div>

    <section data-show-state="issued being-issued failed revoked not-requested" id="content"></section>

    <section data-show-state="loading" role="status" aria-label="Loading your credentials">
      <div class="wx-creds">
        <div class="tx-card"><div class="wx-skel-row"><div class="tx-skeleton"></div><div class="tx-skeleton"></div><div class="tx-skeleton"></div></div></div>
        <div class="tx-card"><div class="wx-skel-row"><div class="tx-skeleton"></div><div class="tx-skeleton"></div><div class="tx-skeleton"></div></div></div>
      </div>
    </section>

    <section data-show-state="forbidden">
      <div class="tx-alert tx-alert--error" role="alert">
        <span data-icon="LockOutlined"></span>
        <div>
          <div>You may not see the credentials of your company (HTTP 403). Ask your Company Admin for the role IT Admin.</div>
          <code>urn:c4-m1:problem:forbidden</code>
        </div>
      </div>
    </section>
  </main>

  <script src="../shared/icons.js"></script>
  <script src="../shared/nav.js"></script>
  <script src="../shared/data.js"></script>
  <script src="../shared/shell.js"></script>
  <script src="../shared/wallets.js"></script>
  <script>
    (function () {
      'use strict';
      const { esc } = wx;
      const data = mock.data;
      const byState = {
        issued: 'issued', 'two-dataspaces': 'twoDataspaces', 'being-issued': 'requested', failed: 'failed', revoked: 'revoked', 'not-requested': 'none',
      };

      const name = (c, type) => {
        const label = esc(wx.labels.credentialType[type]);
        if (c.v('explain') !== 'info') { return label; }
        return `<span class="cr-name">${label}<button class="cr-info" type="button" title="${esc(wx.labels.credentialDescription[type])}" aria-label="What is the ${label}?">${mock.icon('InfoOutlined', 'sm')}</button></span>`;
      };
      const desc = (c, type) => (c.v('explain') === 'text' ? `<p class="wx-cred__desc">${esc(wx.labels.credentialDescription[type])}</p>` : '');

      /** One sentence per status, in the words of the company. No failure message: the company view has none. */
      const statusLine = (cr) => ({
        NONE: 'Requested during onboarding, after your dataspace wallet is set up.',
        REQUESTED: `Requested ${wx.ago(cr.requestedAt)}. The issuer puts it into your wallet; this usually takes a few minutes.`,
        ISSUED: `In your wallet since ${wx.dateTime(cr.issuedAt)}.`,
        FAILED: 'The issuer could not issue it. Your onboarding service provider can start a new attempt.',
        CANCELLED: 'The request was cancelled.',
        REVOCATION_PENDING: 'Your onboarding service provider is revoking it.',
        REVOKED: `Revoked on ${wx.dateTime(cr.revokedAt)}. Connectors no longer accept it.`,
      }[cr.status]);

      const times = (cr) => `<dl class="cr-times">
          <dt>Requested</dt><dd>${wx.dateTime(cr.requestedAt)}</dd>
          <dt>Issued</dt><dd>${wx.dateTime(cr.issuedAt)}</dd>
          ${cr.revokedAt ? `<dt>Revoked</dt><dd>${wx.dateTime(cr.revokedAt)}</dd>` : ''}
        </dl>`;

      // Overall line: computed here from the list, which the UI should not do; see the open question in the hub.
      const banner = (c) => {
        if (c.v('summary') !== 'banner') { return ''; }
        const list = c.list;
        const all = (s) => list.every((cr) => cr.status === s);
        const any = (s) => list.some((cr) => cr.status === s);
        let kind; let title; let text; let iconName;
        if (all('ISSUED')) {
          kind = 'success'; iconName = 'VerifiedUserOutlined'; title = 'All credentials are issued';
          text = 'Your connectors can show partners who your company is and that it is a member of Catena-X.';
        } else if (any('FAILED')) {
          kind = 'error'; iconName = 'ErrorOutlineOutlined'; title = 'A credential could not be issued';
          text = 'Until it is issued, connectors of other participants do not exchange data with yours.';
        } else if (any('REQUESTED')) {
          kind = 'warning'; iconName = 'HourglassTopOutlined'; title = 'Your credentials are being issued';
          text = 'This usually takes a few minutes.';
        } else if (any('REVOKED')) {
          kind = 'default'; iconName = 'BlockOutlined'; title = 'Your membership credential is revoked';
          text = 'Your company is no longer a member of Catena-X. Your BPN credential stays valid.';
        } else {
          kind = 'default'; iconName = 'InfoOutlined'; title = 'No credentials yet';
          text = 'They are issued during onboarding, after your dataspace wallet is set up.';
        }
        return `<div class="wx-banner wx-banner--${kind}" style="margin-bottom: 24px">
            <div class="tx-tile" aria-hidden="true">${mock.icon(iconName)}</div>
            <div class="wx-banner__main"><div class="wx-banner__title">${title}</div><div class="tx-muted">${text}</div></div>
            <a class="tx-btn tx-btn--outlined tx-btn--sm" href="wallet.html">${mock.icon('AccountBalanceWalletOutlined', 'sm')}Your dataspace wallet</a>
          </div>`;
      };

      const layouts = {
        passes: (c) => `<div class="wx-creds cr-passes">${c.list.map((cr) => `
            <article class="wx-pass ${cr.credentialType === 'BPN' ? 'wx-skin--carbon' : 'wx-skin--orange'} ${['FAILED', 'REVOKED', 'NONE'].includes(cr.status) ? 'is-muted' : ''}" aria-label="${esc(wx.labels.credentialType[cr.credentialType])}">
              <div class="wx-pass__head">
                ${wx.brand(cr.dataspace)}
                <span class="wx-pass__issuer">${name(c, cr.credentialType)}<small>${esc(cr.dataspace.name.toUpperCase())}</small></span>
                ${wx.pill('credentialStatus', cr.status)}
              </div>
              <div class="wx-pass__primary">${cr.credentialType === 'BPN'
                ? `<span class="wx-pass__label">Business partner number</span><strong class="wx-mono">${esc(data.companies[data.ids.u1].bpn)}</strong>`
                : `<span class="wx-pass__label">Member of</span><strong>${esc(cr.dataspace.name)}</strong>`}</div>
              <div class="wx-pass__fields">
                <div><span class="wx-pass__label">Requested</span><span>${wx.date(cr.requestedAt)}</span></div>
                <div><span class="wx-pass__label">${cr.revokedAt ? 'Revoked' : 'Issued'}</span><span>${wx.date(cr.revokedAt || cr.issuedAt)}</span></div>
              </div>
              <div class="wx-pass__foot"><span style="color: var(--pass-muted); font-size: 0.875rem">${c.v('explain') === 'text' ? esc(wx.labels.credentialDescription[cr.credentialType]) : statusLine(cr)}</span></div>
            </article>`).join('')}</div>`,

        table: (c) => `<div class="tx-card" style="padding: 8px 0">
            <div class="tx-table-wrap"><table class="tx-table">
              <thead><tr><th>Credential</th><th>Status</th><th>Requested</th><th>Issued</th><th>Revoked</th></tr></thead>
              <tbody>${c.list.map((cr) => `<tr>
                <td><div class="wx-cell-main">${name(c, cr.credentialType)}</div>${c.v('explain') === 'text' ? `<div class="wx-cell-sub">${esc(wx.labels.credentialDescription[cr.credentialType])}</div>` : ''}</td>
                <td>${wx.chip('credentialStatus', cr.status)}</td>
                <td>${wx.dateTime(cr.requestedAt)}</td><td>${wx.dateTime(cr.issuedAt)}</td><td>${wx.dateTime(cr.revokedAt)}</td>
              </tr>`).join('')}</tbody>
            </table></div>
            <p class="tx-muted tx-body2" style="margin: 12px 16px 8px">${c.list.map((cr) => `${esc(wx.labels.credentialTypeShort[cr.credentialType])}: ${statusLine(cr)}`).join('<br>')}</p>
          </div>`,

        lifecycle: (c) => c.list.map((cr) => {
          const s = cr.status;
          const requested = s === 'NONE' ? '' : 'is-done';
          const issued = ['ISSUED', 'REVOKED', 'REVOCATION_PENDING'].includes(s) ? 'is-done' : s === 'REQUESTED' ? 'is-current' : s === 'FAILED' ? 'is-failed' : '';
          const last = s === 'REVOKED' ? 'is-done' : s === 'REVOCATION_PENDING' ? 'is-current' : '';
          const hstep = (cls, iconName, title, meta) => `<div class="wx-hstep ${cls}"><div class="wx-hstep__top">${mock.icon(iconName, 'sm')}${title}</div><div class="tx-muted tx-body2">${meta}</div></div>`;
          return `<section class="tx-card cr-lane">
              <div class="cr-lane__head">
                <div class="tx-row"><span class="tx-tile" aria-hidden="true" style="width: 40px; height: 40px">${mock.icon(wx.icons.credentialType[cr.credentialType], 'sm')}</span>
                  <div><div class="wx-cred__name">${name(c, cr.credentialType)}</div>${desc(c, cr.credentialType)}</div></div>
                ${wx.chip('credentialStatus', s)}
              </div>
              <div class="wx-hsteps" style="--steps: 3">
                ${hstep(requested, 'SendOutlined', 'Requested', wx.dateTime(cr.requestedAt))}
                ${hstep(issued, s === 'FAILED' ? 'ErrorOutlineOutlined' : 'CheckCircleOutlined', s === 'FAILED' ? 'Failed' : 'Issued', s === 'FAILED' ? 'A new attempt is possible' : wx.dateTime(cr.issuedAt))}
                ${hstep(last, 'BlockOutlined', 'Revoked', cr.revokedAt ? wx.dateTime(cr.revokedAt) : 'Only when the company is deactivated')}
              </div>
            </section>`;
        }).join(''),
      };

      function render() {
        const state = document.body.dataset.state;
        const c = { state, list: data.companyCredentials[byState[state]] || [], v: (k) => mock.variant(k) };
        document.getElementById('persona').innerHTML = wx.persona(state === 'forbidden' ? 'max' : 'erika', state === 'revoked' ? 'company deactivated' : '');
        document.getElementById('feature-tabs').innerHTML = wx.tabs('credentials.html');
        if (byState[state]) {
          document.getElementById('content').innerHTML = banner(c) + layouts[c.v('layout')](c);
        }
      }

      mock.on('click', '[data-state-button]', () => setTimeout(render));
      mock.onConfigure(render);
      render();
    })();
  </script>
</body>
</html>
