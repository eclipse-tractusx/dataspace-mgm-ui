# nginx configuration shared by all apps of the workspace (see docs/architecture/README.md).
# The runtime configuration /config.json is mounted from a ConfigMap into /usr/share/nginx/html/config.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location = /config.json {
    add_header Cache-Control "no-store";
    add_header X-Content-Type-Options "nosniff" always;
    try_files /config/config.json =404;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
  }

  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    try_files $uri /index.html;
  }
}
